# Runs the test suite on every push to main and on every pull request,
# and by hand from the Actions tab.
# Nothing is installed from npm: the project has no dependencies, the
# runner only needs ffmpeg for the test media and Chrome for the
# interface tests, and the Ubuntu image already carries Chrome.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels the run still going.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg

      # Ubuntu 24.04 restricts the user namespaces that Chrome's sandbox
      # is built on, and headless Chrome then exits before loading a page.
      - name: Let Chrome start its sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Check
        run: node check.mjs

      - name: Test
        run: node --test
